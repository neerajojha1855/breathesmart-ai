<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="breezeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Botanical Leaf Symbolizing Clean Air -->
  <path d="M32 12C32 12 18 22 18 36C18 43.732 24.268 50 32 50C39.732 50 46 43.732 46 36C46 22 32 12 32 12Z" 
        fill="url(#leafGrad)" opacity="0.9" />

  <!-- Airflow / Breeze Streamlines (Dynamic Breathing Curves) -->
  <path d="M14 33C20 33 22 28 29 28C35 28 37 32 44 32C48 32 50 30 50 30" 
        stroke="url(#breezeGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M17 40C22 40 25 36 32 36C38 36 41 39 47 39" 
        stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />

  <!-- AI Intelligence Core Nodes -->
  <circle cx="32" cy="24" r="2.5" fill="#FFFFFF" />
  <circle cx="41" cy="30" r="1.8" fill="#38BDF8" />
  <circle cx="23" cy="35" r="1.5" fill="#34D399" />
</svg>